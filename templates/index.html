<!doctype html>
<html>
<head>
    <title>Meine erste Flask-Seite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Zusätzliches CSS für die Nachrichten */
        .news-section {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .news-section h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .news-article {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #eee;
        }
        .news-article:last-child {
            border-bottom: none; /* Kein Trenner nach dem letzten Artikel */
        }
        .news-article h3 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #007bff;
        }
        .news-article p {
            font-size: 0.9em;
            color: #555;
            line-height: 1.5;
        }
        .news-article a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .news-article a:hover {
            text-decoration: underline;
        }
        .news-thumbnail {
            float: right;
            margin-left: 15px;
            max-width: 120px;
            height: auto;
            border-radius: 4px;
        }
        .news-article::after { /* Clearfix für Float */
            content: "";
            display: table;
            clear: both;
        }

        /* Zusätzliches CSS für die Webcam-Einbettung (wie zuvor) */
        .webcam-container {
            max-width: 800px; /* Oder eine andere Breite, die zu deinem Layout passt */
            margin: 20px auto; /* Etwas Abstand nach oben und unten, zentriert */
            border: 1px solid #ccc;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
            padding: 10px;
        }
        .webcam-container h2 {
            margin-top: 0;
            color: #333;
        }
        .webcam-source {
            font-size: 0.8em;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }
        /* Basierend auf deinem Original-Layout: */
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4; /* Beispiel Hintergrundfarbe */
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        main {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea {
            width: calc(100% - 10px); /* Berücksichtigt Padding */
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>Willkommen auf meiner Website!</h1>
    </header>
    <main>
        <p>Diese Seite wird von Flask gerendert.</p>

        <form method="post" action="/">
            <label for="text">Text zur Analyse:</label><br>
            <textarea id="text" name="text" rows="4" cols="50" placeholder="Hier deinen Text eingeben..."></textarea><br><br>
            <button type="submit">Analysieren</button>
        </form>

        {% if result %}
        <h2>Analyse Ergebnis:</h2>
        <p>{{ result }}</p>
        {% endif %}


        <div class="webcam-container">
            <h2>Live Webcam: Kulturpalast, Warschau</h2>
            <p>Aktuelle Ansicht des beeindruckenden Kulturpalastes und der Umgebung in Warschau, Polen.</p>

            <iframe
                src="https://www.earthtv.com/de/webcam/warschau-kulturpalast/embed"
                frameborder="0"
                allowfullscreen
                width="100%"
                height="450">
            </iframe>
            <div class="webcam-source">Quelle: <a href="https://www.earthtv.com/de/webcam/warschau-kulturpalast" target="_blank">earthTV.com</a></div>
        </div>
    </main>
</body>
</html>
